[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "lorax-arg"
version = "0.1.8"
description = "Interactive ARG visualization for genomics"
readme = {file = "packages/app/README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{name = "Lorax Team"}]
keywords = [
  "lorax",
  "arg",
  "ancestral recombination graph",
  "tree sequence",
  "visualization",
  "genomics",
  "evolution",
  "phylogenetics",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Environment :: Console",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-socketio>=5.11,<6",
  "python-dotenv>=1,<2",
  "click>=8.1,<9",
  "aiofiles>=24,<26",
  "aiohttp>=3.10,<4",
  "numpy>=2.0,<2.4",
  "pandas>=2.0,<3",
  "pyarrow>=18,<26",
  "tskit>=1.0,<2",
  "tszip>=0.2,<1",
  "redis>=5,<9",
  "google-cloud-storage>=3,<4",
  "starlette>=0.40,<2",
  "psutil>=5,<8",
  "ete3>=3.1,<4",
  "numba>=0.61,<0.63",
  "python-multipart>=0.0.10,<1",
]

[project.urls]
Homepage = "https://lorax.in"
Documentation = "https://lorax.in"
Source = "https://github.com/pratikkatte/lorax"
Issues = "https://github.com/pratikkatte/lorax/issues"

[project.optional-dependencies]
prod = [
  "gunicorn>=23,<24",
]
dev = [
  "pytest>=7,<9",
  "pytest-asyncio>=0.21,<2",
  "pytest-cov>=4,<8",
  "httpx>=0.24,<1",
  "locust>=2.15,<3",
  "python-socketio[client]>=5.11,<6",
  "msprime>=1.2,<2",
]

[project.scripts]
lorax = "lorax_app.cli:main"
lorax-arg = "lorax_app.cli:main"
lorax-backend = "lorax.cli:main"

[tool.setuptools.packages.find]
where = ["packages/app", "packages/backend"]
include = ["lorax_app*", "lorax*"]

[tool.setuptools.package-data]
lorax_app = [
  "static/**/*",
  "static/*",
]
lorax = ["*.json", "*.yaml", "*.yml"]
